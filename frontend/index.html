<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12221e" />
    <meta name="description" content="Encuentra y prioriza decisores de gestoras de renta variable con evidencia pública." />
    <title>Kerna Client Research</title>
    <script>
      // Apply the saved theme before the first paint to avoid a light flash.
      try { var t = localStorage.getItem('kerna-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
